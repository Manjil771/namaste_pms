name: nhpms
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State Management
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.0
  logger: ^2.4.0

  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^10.0.0

  # UI Components
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  cached_network_image: ^3.4.0

  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

  # Date & Time
  intl: ^0.20.0
  table_calendar: ^3.1.2

  # Charts
  fl_chart: ^1.2.0

  # Utilities
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  file_picker: ^11.0.2

  # QR Scanner
  mobile_scanner: ^7.2.0

  # PDF Generation
  printing: ^5.13.0
  pdf: ^3.10.8

  # Device Info
  device_info_plus: ^12.4.0

  # Permission Handling
  permission_handler: ^12.0.1

  # Connectivity
  connectivity_plus: ^7.1.1

  # Local Notifications
  flutter_local_notifications: ^21.0.0

  # Animations
  lottie: ^3.1.2

  # Image Processing
  image: ^4.2.0

  # URL Launcher
  url_launcher: ^6.3.1

  # Share
  share_plus: ^12.0.2

  # App Rating
  rate_my_app: ^2.1.0

  # In-App Updates
  in_app_update: ^4.2.3

  # Cupertino Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Retrofit Generator
  build_runner: ^2.4.13
  retrofit_generator: ^10.2.5

  # Launcher Icons
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true